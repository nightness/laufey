name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  native-e2e:
    name: native-e2e / ${{ matrix.backend }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop; each e2e step below has its own, much shorter, timeout.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, backend: cef }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: native-e2e
          key: ${{ matrix.os }}-${{ matrix.backend }}

      # CEF fetches a large prebuilt binary distribution; cache it.
      - name: Cache CEF
        if: matrix.backend == 'cef'
        uses: actions/cache@v6
        with:
          path: vendor/cef
          key: cef-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      # Per-backend deps mirror the proven build-{winit,webview,cef} jobs, plus
      # the runtime libs the *run* step needs (xvfb, dbus, libxkbcommon-x11 for
      # winit). The backend-common (cef/webview) tray dlopens the appindicator
      # library at runtime — no dev package is needed to build; the cef leg
      # installs the Ayatana *runtime* lib so the real (non-stub) tray path is
      # exercised and gated via LAUFEY_E2E_REQUIRE_TRAY (issue #63).
      - name: Install dependencies (Linux, winit)
        if: runner.os == 'Linux' && matrix.backend == 'winit'
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config xvfb dbus-x11 xclip \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # openbox: a window manager under Xvfb for the window-API and HiDPI
      # steps; xdotool + x11-utils: real X input and window geometry;
      # xdg-utils: the registered URL scheme opened with xdg-open.
      - name: Install dependencies (Linux, webview)
        if: runner.os == 'Linux' && matrix.backend == 'webview'
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config xvfb dbus-x11 \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            openbox xdotool x11-utils xdg-utils

      - name: Install dependencies (Linux, cef)
        if: runner.os == 'Linux' && matrix.backend == 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config xvfb dbus-x11 \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev libgtk-3-dev \
            libgbm-dev libasound2-dev libpango1.0-dev libcairo2-dev libxcomposite-dev \
            libxdamage-dev libxrandr-dev libxkbcommon-dev libdbus-1-dev libxext-dev \
            libxfixes-dev libayatana-appindicator3-1 \
            openbox xdotool x11-utils xdg-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install make ninja -y
          if [ "${{ matrix.backend }}" = "webview" ]; then
            nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          fi

      # Build the Rust runtime/driver BEFORE msvc-dev-cmd: cargo's own toolchain
      # detection invokes MSVC link.exe by full path, but once msvc-dev-cmd has
      # run, Git bash's /usr/bin/link shadows it and the build fails.
      - name: Build runtime + driver
        shell: bash
        run: |
          cargo build --release -p native_e2e_runtime
          if [ "${{ matrix.backend }}" != "winit" ]; then
            cargo build --release -p storage_e2e_runtime
            cargo build --release -p single_instance_e2e_runtime
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo build --release -p native_e2e_driver
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.backend != 'winit'
        with:
          # windows-11-arm: an ARM64 toolchain, so CMake links the arm64
          # WebView2 loader (as in build-webview).
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build backend
        if: ${{ !(runner.os == 'Windows' && matrix.backend == 'cef') }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.backend }}" = "webview" ]; then
            WEBVIEW2_ROOT="$(pwd)/$(ls -d packages/Microsoft.Web.WebView2.* | head -1)" make webview
          else
            make ${{ matrix.backend }}
          fi

      # As in build-cef: run make from the default shell (pwsh), where the
      # Windows tar extracts the CEF dist. Under Git bash, GNU tar reads the
      # "D:/..." archive path as a remote host and the extraction fails.
      - name: Build backend (Windows, cef)
        if: runner.os == 'Windows' && matrix.backend == 'cef'
        run: make cef

      - name: Early resize at 1x
        shell: bash
        run: LAUFEY_E2E_EARLY_RESIZE=1 scripts/native-e2e-run.sh ${{ matrix.backend }} --window-api 2>&1 | grep EARLY || true

      # HiDPI: the window-API battery at a device scale factor of 2 (Linux:
      # CEF --force-device-scale-factor=2, WebKitGTK GDK_SCALE=2; Windows:
      # the display's own scale, raised first). Sizes and positions must stay
      # in DIPs, the page's devicePixelRatio and the reported scales must be
      # the factor, and the window system must have the window at that many
      # physical pixels. macOS runners have one 1x display and no way to add
      # a 2x one without a person, so it runs on Linux and Windows. Last in
      # the job: the Windows display stays scaled.
      - name: Raise the display scale (Windows)
        id: scale
        if: runner.os == 'Windows' && matrix.backend != 'winit'
        shell: pwsh
        run: scripts/windows-display-scale.ps1 -Percent 200

      - name: HiDPI
        if: runner.os == 'Linux' || (runner.os == 'Windows' && matrix.backend != 'winit' && steps.scale.outputs.scale != '1')
        timeout-minutes: 10
        shell: bash
        env:
          LAUFEY_E2E_EXPECT_SCALE: ${{ runner.os == 'Windows' && steps.scale.outputs.scale || '2' }}
        run: |
          for i in 1 2; do
            LAUFEY_E2E_EARLY_RESIZE=1 scripts/native-e2e-run.sh ${{ matrix.backend }} --hidpi || echo "ITERATION $i FAILED"
          done

      # A backend that crashed mid-run leaves only "exited before reporting
      # an overall result"; print the crash report it left (any e2e step).
      - name: Crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        timeout-minutes: 3
        run: |
          # ReportCrash writes the report a few seconds after the process
          # dies; give it time before concluding there is none.
          for _ in $(seq 1 30); do
            ls ~/Library/Logs/DiagnosticReports/*.ips >/dev/null 2>&1 && break
            sleep 2
          done
          # The exception and the crashed + main threads' backtraces; a
          # whole report is too long for the log.
          ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3 |
            while read -r f; do python3 scripts/print-crash-report.py "$f"; done

