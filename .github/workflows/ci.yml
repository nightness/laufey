name: CI

on:
  push:
    branches: [main, denext/integration]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Nightly, so flakes and runner-image drift show up between merges.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Read-only by default; a job that needs more (the release) asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          pipx install "clang-format==22.1.5"

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: clang-format
        run: |
          find capi cef/src webview/src -name '*.cc' -o -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.mm' | \
            xargs clang-format --dry-run --Werror

      - name: deno fmt
        run: deno fmt --check

      - name: deno lint
        run: deno lint

  test:
    name: cargo test (capi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test
      # Only the capi crate has unit-testable logic (pure conversions /
      # builders). The example runtimes are cdylibs and the winit/webview
      # backends require display servers, so we don't run their tests in CI.
      - run: cargo test -p laufey --lib
      - run: cargo test -p laufey --doc
      # backend-common's app data directory resolver (plain C++, no deps).
      - name: backend-common data_dir_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/data_dir_test.cc backend-common/src/data_dir.cc \
            backend-common/src/launch_config.cc \
            -o "$RUNNER_TEMP/data_dir_test"
          "$RUNNER_TEMP/data_dir_test"
      # backend-common's launch file reader (plain C++, no deps; validates
      # values with data_dir.cc's rules).
      - name: backend-common launch_config_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/launch_config_test.cc \
            backend-common/src/launch_config.cc backend-common/src/data_dir.cc \
            -o "$RUNNER_TEMP/launch_config_test"
          "$RUNNER_TEMP/launch_config_test"
      # The host's command line: options stop at "--", a packaged app ignores
      # --runtime, a deep-link launch drops its command-line switches.
      - name: backend-common launch_args_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/launch_args_test.cc \
            backend-common/src/launch_args.cc \
            backend-common/src/launch_config.cc backend-common/src/data_dir.cc \
            -o "$RUNNER_TEMP/launch_args_test"
          "$RUNNER_TEMP/launch_args_test"
      # backend-common's single-instance lock: framing, limits, naming, and a
      # real Unix-socket lock (stale socket, simultaneous acquire). ctest runs
      # it on every OS in build-webview.
      - name: backend-common single_instance_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/single_instance_test.cc \
            backend-common/src/single_instance.cc \
            backend-common/src/single_instance_posix.cc \
            backend-common/src/launch_config.cc backend-common/src/data_dir.cc \
            -o "$RUNNER_TEMP/single_instance_test"
          "$RUNNER_TEMP/single_instance_test"

      # The native check on URLs the page asks the reserved open-external
      # bridge call to open (header-only; ctest also runs it per backend).
      - name: backend-common external_links_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/external_links_test.cc \
            -o "$RUNNER_TEMP/external_links_test"
          "$RUNNER_TEMP/external_links_test"
      # The dialog paths show page text in-process and start no program: no
      # process-spawning or shell API in them (the Windows prompt used to
      # interpolate the page's text into a PowerShell command line). The
      # winit prompt's unit tests check the argv it hands osascript / zenity;
      # this keeps the APIs from coming back.
      - name: dialog paths call no shell or process API
        shell: bash
        run: |
          set -euo pipefail
          pattern='_popen|popen\(|system\(|CreateProcess|ShellExecute|WinExec|powershell|cmd\.exe|std::process::Command'
          files=(backend-common/src/dialog_win.cc backend-common/src/dialog_mac.mm
                 backend-common/src/dialog_linux.cc)
          if grep -nE "$pattern" "${files[@]}"; then
            echo "a dialog path calls a shell / process API" >&2
            exit 1
          fi
          # The winit prompt's Windows half (prompt.rs `mod win`) likewise.
          awk '/^mod win \{/,/^}/' backend-winit-common/src/prompt.rs > "$RUNNER_TEMP/prompt_win.rs"
          test -s "$RUNNER_TEMP/prompt_win.rs"
          if grep -nE "$pattern" "$RUNNER_TEMP/prompt_win.rs"; then
            echo "the winit Windows prompt calls a shell / process API" >&2
            exit 1
          fi

  # backend-winit-common's unit tests (click counting, frame offsets, resize
  # reporting, file-drop batching, window-API bookkeeping). Pure logic, no
  # display, but several are per-OS (cfg-gated), so every desktop OS runs them.
  test-winit-common:
    name: cargo test (backend-winit-common) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test-winit-common
          key: ${{ matrix.os }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo test -p laufey-backend-winit-common --lib

  # The cross-thread rendezvous behind the synchronous UI-thread calls
  # (backend-common/include/laufey_sync_call.h: cef_invoke_sync,
  # gtk_invoke_sync, GtkRunSync, WinIoInit) and the passkey ceremony's
  # timeout thread, under ThreadSanitizer: a notify after the waiter may have
  # destroyed its condition variable is reported as a data race on the first
  # call it happens to, where a plain run only hangs now and then.
  tsan:
    name: ThreadSanitizer (backend-common)
    runs-on: ubuntu-24.04
    env:
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner kernel randomizes mmap with 32 bits, which ThreadSanitizer's
      # shadow memory layout doesn't support ("unexpected memory mapping").
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: sync_call_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=thread -pthread \
            -Ibackend-common/include \
            backend-common/tests/sync_call_test.cc -o "$RUNNER_TEMP/sync_call_test"
          "$RUNNER_TEMP/sync_call_test"
      - name: passkey_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=thread -pthread \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/passkey_test.cc backend-common/src/passkey.cc \
            backend-common/src/single_instance.cc \
            backend-common/src/single_instance_posix.cc \
            backend-common/src/launch_config.cc backend-common/src/data_dir.cc \
            -o "$RUNNER_TEMP/passkey_test"
          "$RUNNER_TEMP/passkey_test"
      # The UI-thread task dispatcher (Dispatch / the loop / Close racing) and
      # the auth session's one-session slot and exactly-once result.
      - name: auth_main_thread_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=thread -pthread \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/auth_main_thread_test.cc \
            backend-common/src/auth_session.cc \
            -o "$RUNNER_TEMP/auth_main_thread_test"
          "$RUNNER_TEMP/auth_main_thread_test"
      # The WebKitGTK response body stream: a writer thread against a reader
      # on a GMainContext.
      - name: scheme_body_stream_test
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
          c++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -O1 -g \
            -fsanitize=thread -pthread \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/scheme_body_stream_test.cc \
            backend-common/src/scheme_body_stream_linux.cc \
            $(pkg-config --cflags --libs gio-2.0) \
            -o "$RUNNER_TEMP/scheme_body_stream_test"
          "$RUNNER_TEMP/scheme_body_stream_test"
      - name: single_instance_test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=thread -pthread \
            -Ibackend-common/include -Icapi/include \
            backend-common/tests/single_instance_test.cc \
            backend-common/src/single_instance.cc \
            backend-common/src/single_instance_posix.cc \
            backend-common/src/launch_config.cc backend-common/src/data_dir.cc \
            -o "$RUNNER_TEMP/single_instance_test"
          "$RUNNER_TEMP/single_instance_test"

  build-winit:
    name: winit / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc/libstdc++ baseline low (glibc 2.35,
          # GLIBCXX_3.4.30) so binaries run on Debian 12 / Ubuntu 22.04+.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-14 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: winit
          # rust-cache keys on runner.os+arch only ("Linux-x64"), not the
          # image version, so a cache built on the old ubuntu-latest (24.04)
          # restores as a full match onto ubuntu-22.04 and poisons the target
          # dir (stale fingerprints, missing dep rlibs -> E0463). Pin per image.
          key: ${{ matrix.os }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 -y --no-progress

      - run: make winit

      - name: Package
        shell: bash
        run: |
          mkdir staging
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/laufey_winit.exe staging/
            cd staging && 7z a ../laufey-winit-${{ matrix.target }}.zip *
          else
            cp target/release/laufey_winit staging/
            tar czf laufey-winit-${{ matrix.target }}.tar.gz -C staging .
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laufey-winit-${{ matrix.target }}
          path: |
            laufey-winit-${{ matrix.target }}.tar.gz
            laufey-winit-${{ matrix.target }}.zip

  # End-to-end native-chrome / windowing tests. See docs/e2e-testing.md.
  # Drives the *same* backend-agnostic native_e2e_runtime under each backend:
  #   Layer 0 (all): in-process readback + event-callback + clipboard + menu/
  #                  tray click round-trips (via the test_click_menu_item hook).
  #   Layer 1 (Linux, cef): D-Bus StatusNotifier/dbusmenu observer (run below).
  #
  # macOS exercises all three backends (both native-chrome codebases) end to
  # end. Non-macOS legs are included only where they pass reliably; the rest are
  # known backend limitations under headless CI, tracked as follow-ups:
  #   - winit / linux : the winit backend doesn't support Linux menus and panics
  #                     building a muda menu with no GTK init.
  #   - webview / linux: WebKitGTK/Xlib isn't thread-safe under the worker-thread
  #                      runtime (xcb_xlib_threads_sequence_lost); only the
  #                      custom-scheme request-body round trip runs there.
  native-e2e:
    name: native-e2e / ${{ matrix.backend }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop; each e2e step below has its own, much shorter, timeout.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, backend: winit }
          - { os: macos-14, backend: webview }
          - { os: macos-14, backend: cef }
          - { os: windows-latest, backend: winit }
          - { os: windows-latest, backend: webview }
          - { os: windows-latest, backend: cef }
          - { os: ubuntu-22.04, backend: cef }
          # The Layer-0 battery is excluded on webview/linux (see above); the
          # storage e2e and the request-body round trip run there.
          - { os: ubuntu-22.04, backend: webview, layer0_excluded: true }
          # arm64: WebView2 on Windows on Arm, CEF on Linux arm64.
          - { os: windows-11-arm, backend: webview }
          - { os: ubuntu-22.04-arm, backend: cef }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: native-e2e
          key: ${{ matrix.os }}-${{ matrix.backend }}

      # CEF fetches a large prebuilt binary distribution; cache it.
      - name: Cache CEF
        if: matrix.backend == 'cef'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/cef
          key: cef-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      # Per-backend deps mirror the proven build-{winit,webview,cef} jobs, plus
      # the runtime libs the *run* step needs (xvfb, dbus, libxkbcommon-x11 for
      # winit). The backend-common (cef/webview) tray dlopens the appindicator
      # library at runtime — no dev package is needed to build; the cef leg
      # installs the Ayatana *runtime* lib so the real (non-stub) tray path is
      # exercised and gated via LAUFEY_E2E_REQUIRE_TRAY (issue #63).
      - name: Install dependencies (Linux, winit)
        if: runner.os == 'Linux' && matrix.backend == 'winit'
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config xvfb dbus-x11 xclip \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # openbox: a window manager under Xvfb for the window-API and HiDPI
      # steps; xdotool + x11-utils: real X input and window geometry;
      # xdg-utils: the registered URL scheme opened with xdg-open.
      - name: Install dependencies (Linux, webview)
        if: runner.os == 'Linux' && matrix.backend == 'webview'
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config xvfb dbus-x11 \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            openbox xdotool x11-utils xdg-utils

      - name: Install dependencies (Linux, cef)
        if: runner.os == 'Linux' && matrix.backend == 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config xvfb dbus-x11 \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev libgtk-3-dev \
            libgbm-dev libasound2-dev libpango1.0-dev libcairo2-dev libxcomposite-dev \
            libxdamage-dev libxrandr-dev libxkbcommon-dev libdbus-1-dev libxext-dev \
            libxfixes-dev libayatana-appindicator3-1 \
            openbox xdotool x11-utils xdg-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pinned versions (the community packages carry their downloads' checksums).
          choco install make --version=4.4.1 -y --no-progress
          choco install ninja --version=1.13.2 -y --no-progress
          if [ "${{ matrix.backend }}" = "webview" ]; then
            # The WebView2 SDK at a pinned version, checked against its
            # SHA-256 before use (nuget.org's flat container; the .nupkg is a zip).
            WV2_VERSION=1.0.4258.31
            WV2_SHA256=56f7f4b8bf9aee4b8efefbbdd4f67d5f74ebd1b100ed0806da71bf76af481aa9
            curl -fsSL --retry 3 -o wv2.zip "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$WV2_VERSION/microsoft.web.webview2.$WV2_VERSION.nupkg"
            echo "$WV2_SHA256  wv2.zip" | sha256sum -c -
            powershell -NoProfile -Command "Expand-Archive -Path wv2.zip -DestinationPath packages/Microsoft.Web.WebView2.$WV2_VERSION"
            rm wv2.zip
          fi

      # Build the Rust runtime/driver BEFORE msvc-dev-cmd: cargo's own toolchain
      # detection invokes MSVC link.exe by full path, but once msvc-dev-cmd has
      # run, Git bash's /usr/bin/link shadows it and the build fails.
      - name: Build runtime + driver
        shell: bash
        run: |
          cargo build --release -p native_e2e_runtime
          if [ "${{ matrix.backend }}" != "winit" ]; then
            cargo build --release -p storage_e2e_runtime
            cargo build --release -p single_instance_e2e_runtime
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo build --release -p native_e2e_driver
          fi

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows' && matrix.backend != 'winit'
        with:
          # windows-11-arm: an ARM64 toolchain, so CMake links the arm64
          # WebView2 loader (as in build-webview).
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build backend
        if: ${{ !(runner.os == 'Windows' && matrix.backend == 'cef') }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.backend }}" = "webview" ]; then
            WEBVIEW2_ROOT="$(pwd)/$(ls -d packages/Microsoft.Web.WebView2.* | head -1)" make webview
          else
            make ${{ matrix.backend }}
          fi

      # As in build-cef: run make from the default shell (pwsh), where the
      # Windows tar extracts the CEF dist. Under Git bash, GNU tar reads the
      # "D:/..." archive path as a remote host and the extraction fails.
      - name: Build backend (Windows, cef)
        if: runner.os == 'Windows' && matrix.backend == 'cef'
        run: make cef

      # Every e2e step has a timeout: a backend that hangs would otherwise
      # hold the runner for the 6-hour job limit. native-e2e-run.sh's own
      # watchdog (5 min) fires first and prints the hung process's stacks.
      - name: Layer 0 — readback / events / clipboard / menu+tray clicks
        if: ${{ !matrix.layer0_excluded }}
        timeout-minutes: 10
        shell: bash
        env:
          # On the cef/linux leg the Ayatana runtime lib is installed above, so
          # a tray id of 0 means the dlopen path regressed to a stub — fail
          # instead of reporting N/A (issue #63).
          LAUFEY_E2E_REQUIRE_TRAY: ${{ (runner.os == 'Linux' && matrix.backend == 'cef') && '1' || '' }}
        run: scripts/native-e2e-run.sh ${{ matrix.backend }}

      # POST/PUT/PATCH bodies (text, binary, >1 MB, empty) from the page reach
      # the app:// scheme handler intact, and never-ending responses stream to
      # fetch / EventSource / XHR and stop when cancelled. Part of Layer 0 on
      # the other legs.
      - name: Custom-scheme request bodies and streaming responses
        if: ${{ matrix.layer0_excluded }}
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --scheme-body

      # The custom-scheme page's fetch and WebSocket to a loopback server
      # (lna_checks.rs). Part of Layer 0 on the other legs, where CEF also
      # checks that a page on any other origin stays blocked.
      - name: Local Network Access — custom-scheme page to loopback
        if: ${{ matrix.layer0_excluded }}
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --lna

      # Layer 1 (Linux, cef): the D-Bus StatusNotifier/dbusmenu observer
      # plays the desktop shell, checks the real appindicator tray from
      # outside, fires a dbusmenu Event that must reach the app's on_click,
      # and fails unless the whole battery passed under it.
      - name: Layer 1 — D-Bus tray / menu observer (Linux, cef)
        if: runner.os == 'Linux' && matrix.backend == 'cef'
        timeout-minutes: 10
        shell: bash
        env:
          LAUFEY_E2E_REQUIRE_TRAY: "1"
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --layer1

      # Window state, constraints, screens, title bar and backdrops (API 38)
      # on their own, on every leg. On Linux under a window manager
      # (openbox): maximize / minimize / fullscreen must apply, not N/A.
      - name: Window API — state, constraints, screens (a WM on Linux)
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --window-api

      # App lifetime (API 38): keep-alive with no window, then quit() ending
      # the event loop. Ends the process, so it runs on its own. Every leg,
      # webview/linux included (no clipboard involved).
      - name: App lifetime — keep-alive and quit
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --lifetime

      # Drag and drop, native file dialogs and the rich clipboard (API 39):
      # drops through the test hook, real OS dialogs driven by the test hook,
      # clipboard text / HTML / PNG / formats / change events. Every leg,
      # webview/linux included (every call hops to the GTK thread). See
      # docs/e2e-testing.md §17.
      - name: I/O — drag and drop, file dialogs, clipboard
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --io

      # Global shortcuts, launch at login and DevTools (API 40): register /
      # list / unregister, a conflict with a second process holding the same
      # shortcut, a real key press on Windows, the login entry turned on and
      # off (and the OS artefact checked), DevTools open / close / toggle; then
      # the DevTools checks again with LAUFEY_INSPECTABLE=0 (nothing opens).
      # Every leg; Winit reports N/A. See docs/e2e-testing.md.
      - name: System — global shortcuts, launch at login, DevTools
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --system

      - name: System — DevTools disabled (LAUFEY_INSPECTABLE=0)
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --devtools-off

      # Menus and notifications (API 41): an app-menu accelerator through the
      # backend's own dispatch (and a real Ctrl+Shift+F9 on Windows), the
      # context-menu close callback, notification responses buffered until a
      # handler registers, live action / body clicks, schedule / list /
      # cancel round trips, a real ActionInvoked from a stand-in notification
      # server on Linux and the toast COM activator on Windows. Every leg;
      # Winit reports N/A. See docs/e2e-testing.md.
      - name: Menus and notifications
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --menus-notifications

      # UI-thread tasks and auth sessions (API 42): tasks run on the OS's own
      # UI thread and are refused after quit(); auth sessions answer
      # not_supported off macOS, and on macOS run a real ephemeral
      # ASWebAuthenticationSession round trip, busy, cancel (test hook,
      # window close, the consent prompt). Every leg; ends with quit(). See
      # docs/e2e-testing.md.
      - name: UI-thread tasks and auth sessions
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --auth-thread

      # The first window of a fresh launch (launch_checks.rs): on screen, its
      # page visible and drawing a frame within 2 s, and outerWidth /
      # outerHeight read as the window's; a non-activating window's page
      # visible and drawing frames too; a hidden window left hidden. On macOS
      # another process's window covers the screen first, as an editor or a
      # terminal would when the app is started from it. Every leg; Winit has
      # no page and reports N/A for those checks.
      - name: Launch visibility — first window on screen, frames drawn
        timeout-minutes: 10
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --launch-visibility

      # The cold-start toast click (Windows): COM starts the app from the
      # activator registration the step above wrote, and the click reaches
      # the response handler as the launch.
      - name: Notifications — cold-start click (Windows)
        if: runner.os == 'Windows' && matrix.backend != 'winit'
        timeout-minutes: 10
        shell: pwsh
        run: scripts/notification-coldstart-e2e.ps1 ${{ matrix.backend }}

      # Per-app web storage (LAUFEY_APP_ID / LAUFEY_DATA_DIR): persistence
      # across relaunches, isolation between apps, unchanged defaults. See
      # docs/app-data.md.
      - name: Storage — per-app persistence / isolation
        if: matrix.backend != 'winit'
        timeout-minutes: 15
        shell: bash
        run: scripts/storage-e2e-run.sh ${{ matrix.backend }}

      # Single-instance lock + argument forwarding (second_instance), the
      # arguments a runtime sees at a cold start, and on macOS files opened
      # through LaunchServices (open_url). See docs/deep-links.md. Winit has
      # no single-instance lock.
      - name: Single instance / opened files
        if: matrix.backend != 'winit'
        timeout-minutes: 15
        shell: bash
        run: scripts/single-instance-e2e-run.sh ${{ matrix.backend }}

      # HiDPI: the window-API battery at a device scale factor of 2 (Linux:
      # CEF --force-device-scale-factor=2, WebKitGTK GDK_SCALE=2; Windows:
      # the display's own scale, raised first). Sizes and positions must stay
      # in DIPs, the page's devicePixelRatio and the reported scales must be
      # the factor, and the window system must have the window at that many
      # physical pixels. macOS runners have one 1x display and no way to add
      # a 2x one without a person, so it runs on Linux and Windows. Last in
      # the job: the Windows display stays scaled.
      - name: Raise the display scale (Windows)
        id: scale
        if: runner.os == 'Windows' && matrix.backend != 'winit'
        shell: pwsh
        run: scripts/windows-display-scale.ps1 -Percent 200

      - name: HiDPI
        if: runner.os == 'Linux' || (runner.os == 'Windows' && matrix.backend != 'winit' && steps.scale.outputs.scale != '1')
        timeout-minutes: 10
        shell: bash
        env:
          LAUFEY_E2E_EXPECT_SCALE: ${{ runner.os == 'Windows' && steps.scale.outputs.scale || '2' }}
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --hidpi

      # A backend that crashed mid-run leaves only "exited before reporting
      # an overall result"; print the crash report it left (any e2e step).
      - name: Crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        timeout-minutes: 3
        run: |
          # ReportCrash writes the report a few seconds after the process
          # dies; give it time before concluding there is none.
          for _ in $(seq 1 30); do
            ls ~/Library/Logs/DiagnosticReports/*.ips >/dev/null 2>&1 && break
            sleep 2
          done
          # The exception and the crashed + main threads' backtraces; a
          # whole report is too long for the log.
          ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3 |
            while read -r f; do python3 scripts/print-crash-report.py "$f"; done

  build-webview:
    name: webview / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Keep the macOS minimum in sync with LSMinimumSystemVersion in
    # webview/macos/Info.plist.in (denoland/deno#35764). Ignored on non-macOS
    # runners. The webview CMakeLists also pins this; setting it here guards
    # against SDK-default minos stamping regardless of build path.
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc/libstdc++ baseline low (glibc 2.35,
          # GLIBCXX_3.4.30) so binaries run on Debian 12 / Ubuntu 22.04+.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-14 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Pinned versions (the community packages carry their downloads' checksums).
          choco install make --version=4.4.1 -y --no-progress
          choco install ninja --version=1.13.2 -y --no-progress
          # The WebView2 SDK at a pinned version, checked against its
          # SHA-256 before use (nuget.org's flat container; the .nupkg is a zip).
          WV2_VERSION=1.0.4258.31
          WV2_SHA256=56f7f4b8bf9aee4b8efefbbdd4f67d5f74ebd1b100ed0806da71bf76af481aa9
          curl -fsSL --retry 3 -o wv2.zip "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$WV2_VERSION/microsoft.web.webview2.$WV2_VERSION.nupkg"
          echo "$WV2_SHA256  wv2.zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Path wv2.zip -DestinationPath packages/Microsoft.Web.WebView2.$WV2_VERSION"
          rm wv2.zip

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          # Match the MSVC toolchain to the runner arch so cl.exe targets ARM64
          # on windows-11-arm; CMake then links the arm64 WebView2 loader.
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            WEBVIEW2_ROOT="$(pwd)/$(ls -d packages/Microsoft.Web.WebView2.* | head -1)" make webview
          else
            make webview
          fi

      # backend-common's C++ unit tests (scheme registry) — built alongside
      # the backend, run here. No display needed.
      - name: Unit tests (ctest)
        shell: bash
        run: ctest --test-dir webview/build --output-on-failure

      - name: Package
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar czf laufey-webview-${{ matrix.target }}.tar.gz -C webview/build laufey_webview.app
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cd webview/build && 7z a ../../laufey-webview-${{ matrix.target }}.zip laufey_webview.exe
          else
            tar czf laufey-webview-${{ matrix.target }}.tar.gz -C webview/build laufey_webview
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laufey-webview-${{ matrix.target }}
          path: |
            laufey-webview-${{ matrix.target }}.tar.gz
            laufey-webview-${{ matrix.target }}.zip

  e2e-cef-linux:
    name: e2e / cef / x86_64-unknown-linux-gnu (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: e2e-cef-linux

      - name: Install runtime + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            xvfb xdotool dbus-x11 \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev \
            libgtk-3-dev libgbm-dev libasound2-dev libpango1.0-dev \
            libcairo2-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxkbcommon-dev libdbus-1-dev libxext-dev libxfixes-dev

      - name: Cache CEF vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/cef
          key: cef-ubuntu-latest-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: Build CEF backend
        run: make cef

      - name: Build e2e harness
        run: cargo build --release -p cef_e2e_runtime

      - name: Launch under Xvfb and assert
        # The harness exits 0 on PASS, 1 on FAIL. `xvfb-run` provides
        # the headless display; `dbus-launch` gives CEF the session
        # bus it expects (Chromium probes it during startup and stalls
        # for several seconds if absent).
        #
        # 90-second outer timeout to fail loud rather than letting CI
        # block for the full 6-hour ceiling if a binding pipeline
        # regression makes the harness hang forever.
        run: |
          export LAUFEY_BIN="$PWD/cef/build/Release/laufey"
          if [ ! -x "$LAUFEY_BIN" ]; then
            echo "::error::CEF backend binary not at $LAUFEY_BIN — build step changed layout?"
            ls cef/build/Release || true
            exit 1
          fi
          log_file="$RUNNER_TEMP/laufey-cef-e2e.log"
          LAUFEY_CEF_LOG_SEVERITY=error timeout 90 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            dbus-launch --exit-with-session \
            "$LAUFEY_BIN" --runtime "$PWD/target/release/libcef_e2e_runtime.so" \
            2>&1 | tee "$log_file"

          if grep -Eq 'google_apis/gcm/engine/registration_request|DEPRECATED_ENDPOINT' "$log_file"; then
            echo "::error::CEF attempted legacy GCM registration"
            exit 1
          fi

  build-cef:
    name: cef / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc/libstdc++ baseline low (glibc 2.35,
          # GLIBCXX_3.4.30) so binaries run on Debian 12 / Ubuntu 22.04+.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # aarch64-pc-windows-msvc (windows-11-arm) is intentionally omitted:
          # CEF-on-Windows-ARM64 needs the windowsarm64 dist + arch-matched MSVC
          # setup and is tracked as a separate follow-up (issue #42).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev \
            libgtk-3-dev libgbm-dev libasound2-dev libpango1.0-dev \
            libcairo2-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxkbcommon-dev libdbus-1-dev libxext-dev libxfixes-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install make --version=4.4.1 -y --no-progress
          choco install ninja --version=1.13.2 -y --no-progress

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Cache CEF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/cef
          key: cef-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - run: make cef

      - name: Package
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            tar czf laufey-cef-${{ matrix.target }}.tar.gz -C cef/build/Release laufey.app
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            cd cef/build/Release && 7z a ../../../laufey-cef-${{ matrix.target }}.zip *
          else
            strip --strip-unneeded cef/build/Release/libcef.so
            tar czf laufey-cef-${{ matrix.target }}.tar.gz -C cef/build/Release .
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laufey-cef-${{ matrix.target }}
          path: |
            laufey-cef-${{ matrix.target }}.tar.gz
            laufey-cef-${{ matrix.target }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Every check gates the release, not only the builds whose artifacts it
    # publishes.
    needs:
      [
        lint,
        test,
        test-winit-common,
        tsan,
        native-e2e,
        e2e-cef-linux,
        build-winit,
        build-webview,
        build-cef,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches capi crate version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(awk -F'"' '/^version = / {print $2; exit}' capi/Cargo.toml)
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match capi crate version $crate"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Publish laufey crate to crates.io
        working-directory: capi
        # Non-fatal: a missing/under-scoped CARGO_REGISTRY_TOKEN, or a version
        # already on crates.io, must not block the GitHub release below.
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
