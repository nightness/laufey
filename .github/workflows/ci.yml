name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  native-e2e:
    name: native-e2e / ${{ matrix.backend }} / ${{ matrix.os }} / ${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, backend: cef, rep: 1 }
          - { os: macos-14, backend: cef, rep: 2 }
          - { os: macos-14, backend: cef, rep: 3 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: native-e2e
          key: ${{ matrix.os }}-${{ matrix.backend }}

      # CEF fetches a large prebuilt binary distribution; cache it.
      - name: Cache CEF
        if: matrix.backend == 'cef'
        uses: actions/cache@v6
        with:
          path: vendor/cef
          key: cef-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      # Per-backend deps mirror the proven build-{winit,webview,cef} jobs, plus
      # the runtime libs the *run* step needs (xvfb, dbus, libxkbcommon-x11 for
      # winit). The backend-common (cef/webview) tray dlopens the appindicator
      # library at runtime — no dev package is needed to build; the cef leg
      # installs the Ayatana *runtime* lib so the real (non-stub) tray path is
      # exercised and gated via LAUFEY_E2E_REQUIRE_TRAY (issue #63).
      - name: Install dependencies (Linux, winit)
        if: runner.os == 'Linux' && matrix.backend == 'winit'
        run: |
          sudo apt-get update
          sudo apt-get install -y make pkg-config xvfb dbus-x11 xclip \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install dependencies (Linux, webview)
        if: runner.os == 'Linux' && matrix.backend == 'webview'
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config xvfb dbus-x11 \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install dependencies (Linux, cef)
        if: runner.os == 'Linux' && matrix.backend == 'cef'
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config xvfb dbus-x11 \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev libgtk-3-dev \
            libgbm-dev libasound2-dev libpango1.0-dev libcairo2-dev libxcomposite-dev \
            libxdamage-dev libxrandr-dev libxkbcommon-dev libdbus-1-dev libxext-dev \
            libxfixes-dev libayatana-appindicator3-1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install make ninja -y
          if [ "${{ matrix.backend }}" = "webview" ]; then
            nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          fi

      # Build the Rust runtime/driver BEFORE msvc-dev-cmd: cargo's own toolchain
      # detection invokes MSVC link.exe by full path, but once msvc-dev-cmd has
      # run, Git bash's /usr/bin/link shadows it and the build fails.
      - name: Build runtime + driver
        shell: bash
        run: |
          cargo build --release -p native_e2e_runtime
          if [ "${{ matrix.backend }}" != "winit" ]; then
            cargo build --release -p storage_e2e_runtime
            cargo build --release -p single_instance_e2e_runtime
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo build --release -p native_e2e_driver
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.backend != 'winit'

      - name: Build backend
        if: ${{ !(runner.os == 'Windows' && matrix.backend == 'cef') }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.backend }}" = "webview" ]; then
            WEBVIEW2_ROOT="$(pwd)/$(ls -d packages/Microsoft.Web.WebView2.* | head -1)" make webview
          else
            make ${{ matrix.backend }}
          fi

      # As in build-cef: run make from the default shell (pwsh), where the
      # Windows tar extracts the CEF dist. Under Git bash, GNU tar reads the
      # "D:/..." archive path as a remote host and the extraction fails.
      - name: Build backend (Windows, cef)
        if: runner.os == 'Windows' && matrix.backend == 'cef'
        run: make cef

      - name: Layer 0 — readback / events / clipboard / menu+tray clicks
        if: ${{ !matrix.layer0_excluded }}
        timeout-minutes: 10
        shell: bash
        env:
          # On the cef/linux leg the Ayatana runtime lib is installed above, so
          # a tray id of 0 means the dlopen path regressed to a stub — fail
          # instead of reporting N/A (issue #63).
          LAUFEY_E2E_REQUIRE_TRAY: ${{ (runner.os == 'Linux' && matrix.backend == 'cef') && '1' || '' }}
        run: scripts/native-e2e-run.sh ${{ matrix.backend }}

      # POST/PUT/PATCH bodies (text, binary, >1 MB, empty) from the page reach
      # the app:// scheme handler intact. Part of Layer 0 on the other legs.
      - name: Custom-scheme request bodies
        if: ${{ matrix.layer0_excluded }}
        shell: bash
        run: scripts/native-e2e-run.sh ${{ matrix.backend }} --scheme-body

      # A backend that crashed mid-battery leaves only "exited before
      # reporting an overall result"; print the crash report it left.
      - name: Crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
            echo "== $f"; head -c 60000 "$f"; echo
          done

