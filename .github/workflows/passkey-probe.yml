name: passkey cancel probe (experiment)

on:
  push:
    branches: [fix/denext14-passkey-probe]

permissions:
  contents: read

jobs:
  probe:
    if: false
    name: probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
      - name: Build
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 /O2 .github\exp\passkey_cancel_probe.cc /Fe:probe.exe user32.lib
      - name: Probe
        shell: pwsh
        run: |
          $cases = @(
            @('timeout-only', '0'), @('timeout-only', '0'),
            @('cancel-before', '0'), @('cancel-before', '0'), @('cancel-before', '0'),
            @('cancel-at', '0'), @('cancel-at', '0'), @('cancel-at', '0'),
            @('cancel-at', '20'), @('cancel-at', '20'), @('cancel-at', '20'),
            @('cancel-at', '100'), @('cancel-at', '100'), @('cancel-at', '100'),
            @('cancel-at', '300'), @('cancel-at', '300'),
            @('cancel-at', '1000'), @('cancel-at', '1000'),
            @('cancel-at', '2000'), @('cancel-at', '2000'), @('cancel-at', '2000'),
            @('cancel-repeat', '0'), @('cancel-repeat', '0'), @('cancel-repeat', '0'),
            @('cancel-repeat', '2000'), @('cancel-repeat', '2000')
          )
          foreach ($c in $cases) {
            $out = & .\probe.exe $c[0] $c[1]
            Write-Output "$out (exit $LASTEXITCODE)"
            Start-Sleep -Seconds 3
          }

  exit-loop:
    if: false
    name: exit loop / webview / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: native-e2e
          key: ${{ matrix.os }}-webview
      - name: Install dependencies (Windows)
        shell: bash
        run: |
          choco install make --version=4.4.1 -y --no-progress
          choco install ninja --version=1.13.2 -y --no-progress
          WV2_VERSION=1.0.4258.31
          WV2_SHA256=56f7f4b8bf9aee4b8efefbbdd4f67d5f74ebd1b100ed0806da71bf76af481aa9
          curl -fsSL --retry 3 -o wv2.zip "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$WV2_VERSION/microsoft.web.webview2.$WV2_VERSION.nupkg"
          echo "$WV2_SHA256  wv2.zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Path wv2.zip -DestinationPath packages/Microsoft.Web.WebView2.$WV2_VERSION"
          rm wv2.zip
      - name: Build runtime
        shell: bash
        run: cargo build --release -p storage_e2e_runtime
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Build backend
        shell: bash
        run: WEBVIEW2_ROOT="$(pwd)/$(ls -d packages/Microsoft.Web.WebView2.* | head -1)" make webview
      - name: Exit loop
        timeout-minutes: 60
        shell: bash
        env:
          KEEP_SCRATCH: "1"
        run: scripts/exit-e2e-run.sh webview 40 exit quit
      - name: Collect logs
        if: always()
        shell: bash
        run: cp -r "$(cygpath -u "$TEMP")/laufey-exit-e2e/logs" exit-logs || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exit-loop-${{ matrix.os }}
          path: exit-logs

  deno-exit-loop:
    if: false
    name: deno exit area loop / ${{ matrix.backend }} / windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [webview, cef]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Brainwires/deno
          ref: fix/denext14-windows-exit-diag
          sparse-checkout: .github/denext-runtime
          path: deno
      - name: Download the denext.13 runtime (Brainwires/deno run 37720814135)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37720814135 -R Brainwires/deno -n runtime-x86_64-pc-windows-msvc -D dl
          find dl -name "*.zip" | head
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Exit area x3
        run: |
          archive=$(find "$PWD/dl" -name "*-${{ matrix.backend }}.zip" | head -1)
          echo "archive: $archive"
          rc=0
          for i in 1 2 3; do
            echo "=== round $i"
            TARGET=x86_64-pc-windows-msvc ARCHIVE="$archive" BACKEND=${{ matrix.backend }} \
              WORK_DIR="$RUNNER_TEMP/e2e-$i" E2E_OUT="$RUNNER_TEMP/out-$i" E2E_AREAS=exit \
              bash deno/.github/denext-runtime/e2e/e2e.sh || rc=1
          done
          exit $rc
      - name: Collect logs
        if: always()
        run: |
          mkdir -p exit-logs
          for i in 1 2 3; do cp -r "$RUNNER_TEMP/e2e-$i/w/logs" "exit-logs/round-$i" 2>/dev/null || true; done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deno-exit-loop-${{ matrix.backend }}
          path: exit-logs

  deno-e2e-harness:
    name: deno e2e harness tests (Brainwires/deno fix/denext14-windows-exit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Brainwires/deno
          ref: fix/denext14-windows-exit
          sparse-checkout: |
            .github/denext-runtime
            .github/workflows
          sparse-checkout-cone-mode: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - run: git log --oneline -1
      # The e2e-harness job's command (denext_runtime.yml).
      - run: deno test -A --no-check --no-config --no-lock .github/denext-runtime/e2e/lib/
